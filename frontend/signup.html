<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2457d6" />
    <title>Sign in · WARNwatcher</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <a class="brand" href="./index.html" aria-label="WARNwatcher home">
          <span class="brand-mark" aria-hidden="true">W</span>
          <span class="brand-name">WARN<span>watcher</span></span>
        </a>
        <h1>Watch the companies that matter</h1>
        <p>Sign in to manage your watches, or create a free account to get started.</p>
      </header>

      <div class="auth-tabs" role="tablist" aria-label="Account access">
        <button class="auth-tab" id="login-tab" type="button" role="tab" aria-selected="true" aria-controls="login-panel">Sign in</button>
        <button class="auth-tab" id="signup-tab" type="button" role="tab" aria-selected="false" aria-controls="signup-panel">Create account</button>
      </div>

      <section class="panel" id="login-panel" role="tabpanel" aria-labelledby="login-tab">
        <h2>Welcome back</h2>
        <form id="login-form">
          <label for="login-email">Email address</label>
          <input id="login-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />

          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required />

          <button type="submit">Sign in</button>
        </form>
        <p class="text-link-row"><a href="./forgot-password.html">Forgot password?</a></p>
      </section>

      <section class="panel" id="signup-panel" role="tabpanel" aria-labelledby="signup-tab" hidden>
        <h2>Create your account</h2>
        <form id="signup-form">
          <label for="signup-email">Email address</label>
          <input id="signup-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />

          <label for="signup-password">Password</label>
          <input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" aria-describedby="password-hint" required />
          <p id="password-hint" class="field-hint">Use at least 8 characters.</p>

          <button type="submit">Create account</button>
        </form>
      </section>

      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script src="./signup.js"></script>
  </body>
</html>
