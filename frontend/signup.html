<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WARNwatcher - Sign Up</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>WARNwatcher</h1>
      <p>Create an account, then sign in to manage watchlists.</p>

      <section class="panel">
        <h2>Create Account</h2>
        <form id="signup-form">
          <label for="signup-email">Email</label>
          <input id="signup-email" name="email" type="email" required />

          <label for="signup-password">Password</label>
          <input id="signup-password" name="password" type="password" minlength="8" required />

          <button type="submit">Sign Up</button>
        </form>
      </section>

      <section class="panel">
        <h2>Sign In</h2>
        <form id="login-form">
          <label for="login-email">Email</label>
          <input id="login-email" name="email" type="email" required />

          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" required />

          <button type="submit">Sign In</button>
        </form>
      </section>

      <p id="status" role="status"></p>
      <p><a href="./index.html">Back to watchlists</a></p>
    </main>

    <script src="./signup.js"></script>
  </body>
</html>
