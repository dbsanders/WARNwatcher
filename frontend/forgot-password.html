<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2457d6" />
    <title>Forgot password · WARNwatcher</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <a class="brand" href="./index.html" aria-label="WARNwatcher home">
          <span class="brand-mark" aria-hidden="true">W</span>
          <span class="brand-name">WARN<span>watcher</span></span>
        </a>
        <h1>Reset your password</h1>
        <p>Enter your account email and we’ll send you a secure reset link.</p>
      </header>

      <section class="panel">
        <form id="forgot-password-form">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
          <button type="submit">Send reset link</button>
        </form>
      </section>

      <p id="status" role="status" aria-live="polite"></p>
      <p class="text-link-row"><a href="./signup.html">Back to sign in</a></p>
    </main>

    <script src="./forgot-password.js"></script>
  </body>
</html>
