<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2457d6" />
    <title>Choose a new password · WARNwatcher</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <a class="brand" href="./index.html" aria-label="WARNwatcher home">
          <span class="brand-mark" aria-hidden="true">W</span>
          <span class="brand-name">WARN<span>watcher</span></span>
        </a>
        <h1>Choose a new password</h1>
        <p>Use a unique password with at least 8 characters.</p>
      </header>

      <section class="panel">
        <form id="reset-password-form">
          <label for="password">New password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />

          <label for="confirm-password">Confirm new password</label>
          <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required />

          <button type="submit">Reset password</button>
        </form>
      </section>

      <p id="status" role="status" aria-live="polite"></p>
      <p class="text-link-row"><a href="./signup.html">Back to sign in</a></p>
    </main>

    <script src="./reset-password.js"></script>
  </body>
</html>
