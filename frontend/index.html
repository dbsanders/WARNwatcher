<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WARNwatcher</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>WARNwatcher</h1>
      <p>Get notified when a company appears in the WARN feed.</p>

      <form id="subscribe-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />

        <label for="company">Company Name</label>
        <input id="company" name="company" type="text" required />

        <label for="state">State</label>
        <input id="state" name="state" type="text" value="CA" maxlength="2" />

        <label for="min-employees">Min Employees</label>
        <input id="min-employees" name="min_employees" type="number" min="0" value="0" />

        <button type="submit">Subscribe</button>
      </form>

      <p id="status" role="status"></p>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
