<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2457d6" />
    <title>Current WARN notices · WARNwatcher</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container notices-container">
      <header class="page-header">
        <a class="brand" href="./index.html" aria-label="WARNwatcher home">
          <span class="brand-mark" aria-hidden="true">W</span>
          <span class="brand-name">WARN<span>watcher</span></span>
        </a>
        <h1>Current WARN notices</h1>
        <p>Review the companies and workforce reductions currently reported in the feed.</p>
      </header>

      <div class="account-bar">
        <p id="auth-summary"></p>
        <button id="logout" type="button" class="secondary">Log out</button>
      </div>

      <nav class="button-row" aria-label="Watchlist navigation">
        <a class="button-link" href="./index.html">Create watch</a>
        <a class="button-link secondary" href="./subscriptions.html">Manage watches</a>
        <button id="refresh" type="button" class="secondary">Refresh</button>
      </nav>

      <p id="status" role="status" aria-live="polite"></p>
      <section id="notices-list" aria-label="WARN notices"></section>
    </main>

    <script src="./notices.js"></script>
  </body>
</html>
